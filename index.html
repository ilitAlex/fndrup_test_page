<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Test Donation Page</title>

    <script async src="https://www.googletagmanager.com/gtag/js?id=G-5PY4HBPJEJ"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-5PY4HBPJEJ');
    </script>

    <script>(function(w,d,s,n,a){if(!w[n]){var l='call,catch,on,once,set,then,track'
    .split(','),i,o=function(n){return'function'==typeof n?o.l.push([arguments])&&o
    :function(){return o.l.push([n,arguments])&&o}},t=d.getElementsByTagName(s)[0],
    j=d.createElement(s);j.async=!0;j.src='https://cdn.fundraiseup.com/widget/'+a;
    t.parentNode.insertBefore(j,t);o.s=Date.now();o.v=4;o.h=w.location.href;o.l=[];
    for(i=0;i<7;i++)o[l[i]]=o(l[i]);w[n]=o}
    })(window,document,'script','FundraiseUp','AEMZUDUM');</script>
</head>
<body>

    <h1>Тестовая страница пожертвований</h1>
    
    <a href="#XJKDHSTQ" class="donation-button">Пожертвовать $700</a>

    <script>
        // Использование JS API для отслеживания открытия чекаута
        FundraiseUp.on('checkout.open', function() {
            console.log('Checkout opened!');
            
            // Отправка события в GA4 через gtag
            gtag('event', 'fundraiseup_checkout_open', {
                'event_category': 'engagement',
                'event_label': 'Donation Button Click'
            });

            // Альтернатива через dataLayer (если используешь GTM)
            window.dataLayer.push({
                'event': 'checkout_opened_custom'
            });
        });

        // Отслеживание успешного пожертвования
        FundraiseUp.on('checkout.success', function(details) {
            console.log('Donation success!', details);
            
            // Если сумма пожертвования $700
            if (details.donation.amount === 700) {
                gtag('event', 'purchase', {
                    'transaction_id': details.donation.id,
                    'value': 700,
                    'currency': 'USD',
                    'items': [{
                        'item_name': 'Donation',
                        'item_category': 'Fundraise Up'
                    }]
                });
            }
        });
    </script>

</body>
</html>
